# Manual only. Run one interactive EAS Android preview build locally first.
name: DeyPocket Android Preview (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Trigger preview build
        run: eas build --platform android --profile preview --non-interactive --no-wait
