name: Debiyan Android Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Kenaikan versi APK'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: debiyan-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout master and tags
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check EAS build configuration
        run: node scripts/ci/check-eas.mjs preview

      - name: Compute and write next release version
        id: version
        env:
          BUMP_KIND: ${{ inputs.bump }}
        run: node scripts/ci/bump-version.mjs

      - name: Validate project
        run: |
          npm run validate
          npm run validate:release --if-present

      - name: Build signed Android APK on EAS
        run: |
          npx --yes eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build.json

      - name: Resolve APK build artifact
        id: artifact
        run: node scripts/ci/resolve-build.mjs eas-build.json

      - name: Download and verify APK
        env:
          APK_URL: ${{ steps.artifact.outputs.url }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          mkdir -p release
          curl --fail --location --retry 3 "$APK_URL" --output "release/$APK_NAME"
          test "$(stat -c%s "release/$APK_NAME")" -gt 1000000
          unzip -Z -1 "release/$APK_NAME" | grep -Fxq AndroidManifest.xml
          echo "APK downloaded and verified: release/$APK_NAME"

      - name: Commit version and push master
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json package.json package-lock.json
          git commit -m "chore(release): v$VERSION [skip ci]"
          git push origin HEAD:master

      - name: Publish GitHub Release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          gh release create "$TAG" "release/$APK_NAME" \
            --title "DeyPocket $TAG" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes \
            --latest

      - name: Release summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          {
            echo "## Android release published"
            echo "- Release: $TAG"
            echo "- APK: $APK_NAME"
            echo "- APK update checks will detect this release if the repository is publicly accessible to the app."
          } >> "$GITHUB_STEP_SUMMARY"
